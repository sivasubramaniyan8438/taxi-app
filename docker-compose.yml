services:

  postgres:
    image: postgres:16-alpine
    container_name: taxiapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taxiapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - taxiapp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:20-alpine
    container_name: taxiapp-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install && node src/index.js"
    restart: unless-stopped
    environment:
      PORT: 5002
      DATABASE_URL: postgresql://postgres:password@postgres:5432/taxiapp
      JWT_SECRET: ridego_secret_2024
      NODE_ENV: production
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taxiapp-network

  frontend:
    image: node:20-alpine
    container_name: taxiapp-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run build && npx serve -s build -l 8082"
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      - backend
    networks:
      - taxiapp-network

volumes:
  postgres_data:

networks:
  taxiapp-network:
    driver: bridge
