services:

  postgres:
    image: postgres:16-alpine
    container_name: taxiapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taxiapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - taxiapp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taxiapp-backend
    restart: unless-stopped
    environment:
      PORT: 5002
      DATABASE_URL: postgresql://postgres:password@postgres:5432/taxiapp
      JWT_SECRET: ridego_secret_2024
      NODE_ENV: production
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taxiapp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taxiapp-frontend
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - backend
    networks:
      - taxiapp-network

volumes:
  postgres_data:

networks:
  taxiapp-network:
    driver: bridge
